<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airline Ticketing & Airlines Directory | Golan International</title>
  <meta name="description" content="International & Domestic Airline Ticketing including PIA and AirSial by Golan International Travel & Tourism (DTS Lic: 12729)." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              royal: '#1E40AF',
              blue: '#2563EB',
              sky: '#EFF6FF',
              ice: '#E0F2FE',
              ink: '#0F172A',
              slate: '#334155'
            }
          }
        }
      }
    }
  </script>
  <style>
    .soft-hero-bg {
      background: radial-gradient(circle at top left, #E0F2FE 0%, #EFF6FF 45%, #F8FAFC 100%);
      position: relative;
      overflow: hidden;
    }
    .soft-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px -12px rgba(37, 99, 235, 0.12);
    }
    @keyframes tickerMove {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .airline-ticker-track {
      display: flex;
      width: max-content;
      animation: tickerMove 36s linear infinite;
    }
    .airline-ticker-track:hover {
      animation-play-state: paused;
    }
  </style>
</head>
